services:
  mysql:
    image: mysql:8.4
    container_name: fms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farm_manager
      MYSQL_ROOT_PASSWORD: ${FMS_MYSQL_ROOT_PASSWORD:-fms-local-root-password}
    ports:
      - "3306:3306"
    volumes:
      - fms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:22-alpine
    container_name: fms-app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      SESSION_SECRET: ${FMS_SESSION_SECRET:-development-only-session-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: farm_manager
      DB_USER: root
      DB_PASSWORD: ${FMS_MYSQL_ROOT_PASSWORD:-fms-local-root-password}
    volumes:
      - .:/app
      - fms_node_modules:/app/node_modules
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/tsx ]; then npm ci; fi && npm run db:migrate && npm run dev"]

volumes:
  fms_mysql_data:
  fms_node_modules:
